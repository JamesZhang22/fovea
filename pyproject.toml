[project]
name = "fovea"
version = "0.1.0"
description = "Bird photo culling for macOS — eye-critical focus scoring for Canon CR3"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "onnxruntime>=1.28.0",
    "pillow>=12.3.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
fovea = "fovea.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fovea"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
]
ml = [
    "onnx>=1.22.0",
    "onnxscript>=0.7.1",
    "rfdetr>=1.9.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
]
