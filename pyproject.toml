[project]
name = "fovea"
version = "0.1.0"
description = "Bird photo culling for macOS — eye-critical focus scoring for Canon CR3"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
fovea = "fovea.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fovea"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
